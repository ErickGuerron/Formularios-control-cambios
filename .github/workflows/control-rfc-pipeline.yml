name: RFC Controller

on:
  issues:
    types: [opened, edited, labeled, closed, deleted]

concurrency:
  group: rfc-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  PROJECT_URL: https://github.com/users/ErickGuerron/projects/1
  ORG_LOGIN: MyCSW
  USER_LOGIN: ErickGuerron
  PROJECT_NUMBER: 1
  PROJECT_TITLE: Formularios-control-cambios

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECTS_PAT }}
          script: |
            const issue = context.payload.issue
            const owner = context.repo.owner
            const repo  = context.repo.repo
            const body = issue.body || ''
            const grab = (label) => {
              const variants = [
                new RegExp(`\\*\\*${label}\\*\\*[\\s\\r\\n]+([\\s\\S]*?)(?:\\n\\*\\*|\\n###|$)`, 'i'),
                new RegExp(`^###\\s*${label}\\s*\\n+([\\s\\S]*?)(?:\\n###|$)`, 'im'),
                new RegExp(`^${label}\\s*:\\s*(.+)$`, 'im')
              ];
              for (const re of variants) {
                const m = body.match(re);
                if (m) return m[1].trim();
              }
              return '';
            }
            const tipo   = (grab('Tipo de cambio') || '').toLowerCase()
            const riesgo = (grab('Riesgo') || '').toLowerCase()
            const wanted = new Set(['rfc'])
            if (tipo.includes('estándar') || tipo.includes('estandar')) wanted.add('tipo:estandar')
            if (tipo.includes('normal'))                               wanted.add('tipo:normal')
            if (tipo.includes('emergencia') || tipo.includes('urgente')) wanted.add('tipo:emergencia')
            if (riesgo.includes('bajo'))  wanted.add('riesgo:bajo')
            if (riesgo.includes('medio')) wanted.add('riesgo:medio')
            if (riesgo.includes('alto'))  wanted.add('riesgo:alto')
            const current = new Set((issue.labels || []).map(l => l.name))
            const managed = ['rfc','tipo:estandar','tipo:normal','tipo:emergencia','riesgo:bajo','riesgo:medio','riesgo:alto']
            const toAdd = [...wanted].filter(l => !current.has(l))
            const toRemove = [...current].filter(l => managed.includes(l) && !wanted.has(l))
            if (toRemove.length) {
              await github.rest.issues.removeLabels({ owner, repo, issue_number: issue.number, labels: toRemove }).catch(()=>{})
            }
            if (toAdd.length) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: toAdd })
            }

  add-to-project:
    needs: labels
    if: (github.event.action == 'opened, closed' && contains(github.event.issue.labels.*.name, 'rfc')) || (github.event.action == 'labeled' && github.event.label.name == 'rfc')
    runs-on: ubuntu-latest
    steps:
      - name: Add to Project
        uses: actions/add-to-project@v0.5.0
        with:
          project-url: ${{ env.PROJECT_URL }}
          github-token: ${{ secrets.PROJECTS_PAT }}

  map-fields:
    needs: labels
    runs-on: ubuntu-latest
    steps:
      - name: Map Issue Form → Project fields
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECTS_PAT }}
          script: |
            const ORG_LOGIN = process.env.ORG_LOGIN
            const USER_LOGIN = process.env.USER_LOGIN
            const PROJECT_NUMBER = parseInt(process.env.PROJECT_NUMBER, 10)
            const PROJECT_TITLE = process.env.PROJECT_TITLE
            async function findProjectV2() {
              const tryOrg = await github.graphql(
                `query($login:String!){
                  organization(login:$login){
                    projectsV2(first:50){ nodes{ id title number } }
                  }
                }`, { login: ORG_LOGIN }
              ).catch(()=>null)
              if (tryOrg?.organization?.projectsV2?.nodes?.length) {
                const nodes = tryOrg.organization.projectsV2.nodes
                let hit = nodes.find(n => n.number === PROJECT_NUMBER)
                if (!hit && PROJECT_TITLE) hit = nodes.find(n => n.title === PROJECT_TITLE)
                if (hit) return { id: hit.id }
              }
              const tryUser = await github.graphql(
                `query($login:String!){
                  user(login:$login){
                    projectsV2(first:50){ nodes{ id title number } }
                  }
                }`, { login: USER_LOGIN }
              ).catch(()=>null)
              if (tryUser?.user?.projectsV2?.nodes?.length) {
                const nodes = tryUser.user.projectsV2.nodes
                let hit = nodes.find(n => n.number === PROJECT_NUMBER)
                if (!hit && PROJECT_TITLE) hit = nodes.find(n => n.title === PROJECT_TITLE)
                if (hit) return { id: hit.id }
              }
              throw new Error('Project v2 no encontrado')
            }
            const project = await findProjectV2()
            const projectId = project.id
            const issue = context.payload.issue
            const repo = context.repo
            const body = issue.body || ''
            const grab = (label) => {
              const variants = [
                new RegExp(`\\*\\*${label}\\*\\*[\\s\\r\\n]+([\\s\\S]*?)(?:\\n\\*\\*|\\n###|$)`, 'i'),
                new RegExp(`^###\\s*${label}\\s*\\n+([\\s\\S]*?)(?:\\n###|$)`, 'im'),
                new RegExp(`^${label}\\s*:\\s*(.+)$`, 'im')
              ];
              for (const re of variants) {
                const m = body.match(re);
                if (m) return m[1].trim();
              }
              return '';
            }
            const toDateOnly = (s) => (s && (s.match(/(\d{4}-\d{2}-\d{2})/)||[])[1]) || ''
            const tipo     = grab('Tipo de cambio') || grab('Change Type')
            const riesgo   = grab('Riesgo') || grab('Risk')
            const impacto  = grab('Impacto') || grab('Impact')
            const plan     = grab('Plan de implementación') || grab('Implementation Plan')
            const rollback = grab('Plan de reversa \\(rollback\\)') || grab('RollBack Planning') || grab('Rollback Plan')
            const pruebas  = grab('Plan de pruebas') || grab('Test Planning')
            const vIniTxt  = grab('Ventana \\(inicio\\)') || grab('Init') || grab('Window – Start') || grab('Window - Start')
            const vFinTxt  = grab('Ventana \\(fin\\)')    || grab('Completion') || grab('Window – End') || grab('Window - End')
            const aprob    = grab('Aprobadores requeridos') || grab('Approvers') || grab('Required Approvers')
            const solicitante = grab('Solicitante') || grab('Solicitor') || grab('Applicant') || grab('Requester')
            const issueRes = await github.graphql(
              `query($owner:String!, $name:String!, $n:Int!){
                repository(owner:$owner, name:$name){ issue(number:$n){ id number } }
              }`, { owner: repo.owner, name: repo.repo, n: issue.number }
            )
            const issueId = issueRes.repository.issue.id
            await github.graphql(
              `mutation($projectId:ID!, $contentId:ID!){
                addProjectV2ItemById(input:{projectId:$projectId, contentId:$contentId}){ item { id } }
              }`, { projectId, contentId: issueId }
            )
            const fieldsRes = await github.graphql(
              `query($projectId:ID!){
                node(id:$projectId){
                  ... on ProjectV2 {
                    fields(first:50){
                      nodes{
                        ... on ProjectV2FieldCommon { id name dataType }
                        ... on ProjectV2SingleSelectField { id name options { id name } }
                      }
                    }
                  }
                }
              }`, { projectId }
            )
            const fields = fieldsRes.node.fields.nodes
            const byAnyName = (names) => names
              .map(n => fields.find(f => f?.name?.toLowerCase() === n.toLowerCase()))
              .find(Boolean)
            const fStatus  = byAnyName(['Status','Estado'])
            const fTipo     = byAnyName(['Change Type','Tipo de cambio'])
            const fRiesgo   = byAnyName(['Risk','Riesgo'])
            const fImpacto  = byAnyName(['Impact','Impacto'])
            const fPlan     = byAnyName(['Implementation Plan','Plan de implementación'])
            const fRollback = byAnyName(['RollBack Planning','Rollback Plan','Plan de reversa (rollback)'])
            const fPruebas  = byAnyName(['Test Planning','Plan de pruebas'])
            const fVIni     = byAnyName(['Init','Window – Start','Ventana – Inicio','Window - Start'])
            const fVFin     = byAnyName(['Completion','Window – End','Ventana – Fin','Window - End'])
            const fAprob    = byAnyName(['Approvers','Required Approvers','Aprobadores requeridos'])
            const fSolic    = byAnyName(['Solicitante','Solicitor','Applicant','Requester'])
            const itemsRes = await github.graphql(
              `query($projectId:ID!, $q:String!){
                node(id:$projectId){
                  ... on ProjectV2 {
                    items(first:50, query:$q){
                      nodes{ id content{ ... on Issue { number } } }
                    }
                  }
                }
              }`, { projectId, q: String(issue.number) }
            )
            const item = itemsRes.node.items.nodes.find(n => n.content?.number === issue.number)
            if (!item) throw new Error('Project Item no encontrado')
            const itemId = item.id
            const norm = (s) => (s ?? '').toString().normalize('NFD').replace(/\p{Diacritic}/gu,'').trim().toLowerCase()
            function resolveOptionId(field, value, map) {
              if (!field || !value) return null
              const v = norm(value)
              const wanted = norm((map||{})[v] || v)
              const opts = field.options || []
              let hit = opts.find(o => norm(o.name) === wanted)
              if (!hit) hit = opts.find(o => norm(o.name).includes(wanted) || wanted.includes(norm(o.name)))
              return hit ? hit.id : null
            }
            async function setSelect(field, value, map) {
              const optId = resolveOptionId(field, value, map)
              if(!field || !optId) return
              await github.graphql(
                `mutation($projectId:ID!, $itemId:ID!, $fieldId:ID!, $opt:String!){
                  updateProjectV2ItemFieldValue(input:{ projectId:$projectId, itemId:$itemId, fieldId:$fieldId, value:{ singleSelectOptionId:$opt } }){ clientMutationId }
                }`, { projectId, itemId, fieldId: field.id, opt: optId }
              )
            }
            async function setText(fieldId, val){
              if(!fieldId || !val) return
              await github.graphql(
                `mutation($projectId:ID!, $itemId:ID!, $fieldId:ID!, $val:String!){
                  updateProjectV2ItemFieldValue(input:{ projectId:$projectId, itemId:$itemId, fieldId:$fieldId, value:{ text:$val } }){ clientMutationId }
                }`, { projectId, itemId, fieldId, val }
              )
            }
            async function setDate(fieldId, ymd){
              if(!fieldId || !ymd) return
              await github.graphql(
                `mutation($projectId:ID!, $itemId:ID!, $fieldId:ID!, $val:Date!){
                  updateProjectV2ItemFieldValue(input:{ projectId:$projectId, itemId:$itemId, fieldId:$fieldId, value:{ date:$val } }){ clientMutationId }
                }`, { projectId, itemId, fieldId, val: ymd }
              )
            }
            await setSelect(fStatus, 'Todo', { 'todo':'todo' })
            await setSelect(fTipo,   tipo,   { 'estandar':'estandar', 'estándar':'estandar', 'normal':'normal', 'emergencia':'emergencia', 'urgente':'emergencia' })
            await setSelect(fRiesgo, riesgo, { 'bajo':'bajo', 'medio':'medio', 'alto':'alto' })
            await setText  (fImpacto?.id, impacto)
            await setText  (fPlan?.id,    plan)
            await setText  (fRollback?.id,rollback)
            await setText  (fPruebas?.id, pruebas)
            await setText  (fAprob?.id,   aprob)
            await setDate  (fVIni?.id,    toDateOnly(vIniTxt))
            await setDate  (fVFin?.id,    toDateOnly(vFinTxt))
            await setText  (fSolic?.id,   solicitante)

  set-project-done-on-close:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECTS_PAT }}
          script: |
            const ORG_LOGIN = process.env.ORG_LOGIN
            const USER_LOGIN = process.env.USER_LOGIN
            const PROJECT_NUMBER = parseInt(process.env.PROJECT_NUMBER,10)
            async function getProjectId(){
              const org = await github.graphql(
                `query($login:String!){ organization(login:$login){ projectsV2(first:50){ nodes{ id number } } } }`,
                { login: ORG_LOGIN }
              ).catch(()=>null)
              let hit = org?.organization?.projectsV2?.nodes?.find(n=>n.number===PROJECT_NUMBER)
              if(hit) return hit.id
              const user = await github.graphql(
                `query($login:String!){ user(login:$login){ projectsV2(first:50){ nodes{ id number } } } }`,
                { login: USER_LOGIN }
              )
              return user.user.projectsV2.nodes.find(n=>n.number===PROJECT_NUMBER).id
            }
            const projectId = await getProjectId()
            const issueNum = context.payload.issue.number
            const items = await github.graphql(
              `query($projectId:ID!, $q:String!){
                node(id:$projectId){ ... on ProjectV2 {
                  items(first:50, query:$q){ nodes{ id content{ ... on Issue { number } } } }
                } }
              }`, { projectId, q: String(issueNum) }
            )
            const item = items.node.items.nodes.find(n=>n.content?.number===issueNum)
            if(!item) return
            const fields = await github.graphql(
              `query($projectId:ID!){
                node(id:$projectId){ ... on ProjectV2 {
                  fields(first:50){ nodes{
                    ... on ProjectV2FieldCommon { id name }
                    ... on ProjectV2SingleSelectField { id name options{ id name } }
                  } }
                } }
              }`, { projectId }
            )
            const status = fields.node.fields.nodes.find(f=>f.name.toLowerCase()==='status')
            if(!status) return
            const optDone = (status.options||[]).find(o=>o.name.toLowerCase()==='done')
            if(!optDone) return
            await github.graphql(
              `mutation($projectId:ID!, $itemId:ID!, $fieldId:ID!, $opt:String!){
                updateProjectV2ItemFieldValue(input:{projectId:$projectId,itemId:$itemId,fieldId:$fieldId,value:{singleSelectOptionId:$opt}}){ clientMutationId }
              }`, { projectId, itemId: item.id, fieldId: status.id, opt: optDone.id }
            )

  remove-project-item-on-delete:
    if: github.event.action == 'deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECTS_PAT }}
          script: |
            const ORG_LOGIN = process.env.ORG_LOGIN
            const USER_LOGIN = process.env.USER_LOGIN
            const PROJECT_NUMBER = parseInt(process.env.PROJECT_NUMBER,10)
            async function getProjectId(){
              const org = await github.graphql(
                `query($login:String!){ organization(login:$login){ projectsV2(first:50){ nodes{ id number } } } }`,
                { login: ORG_LOGIN }
              ).catch(()=>null)
              let hit = org?.organization?.projectsV2?.nodes?.find(n=>n.number===PROJECT_NUMBER)
              if(hit) return hit.id
              const user = await github.graphql(
                `query($login:String!){ user(login:$login){ projectsV2(first:50){ nodes{ id number } } } }`,
                { login: USER_LOGIN }
              )
              return user.user.projectsV2.nodes.find(n=>n.number===PROJECT_NUMBER).id
            }
            const projectId = await getProjectId()
            const issueNum = context.payload.issue.number
            const items = await github.graphql(
              `query($projectId:ID!, $q:String!){
                node(id:$projectId){ ... on ProjectV2 {
                  items(first:50, query:$q){ nodes{ id content{ ... on Issue { number } } } }
                } }
              }`, { projectId, q: String(issueNum) }
            )
            const item = items.node.items.nodes.find(n=>n.content?.number===issueNum)
            if(!item) return
            await github.graphql(
              `mutation($projectId:ID!, $itemId:ID!){
                deleteProjectV2Item(input:{ projectId:$projectId, itemId:$itemId }){ clientMutationId }
              }`, { projectId, itemId: item.id }
            )
