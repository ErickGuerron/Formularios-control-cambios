name: Add RFC to Project
on:
  issues:
    types: [opened]
jobs:
  add:
    if: contains(github.event.issue.labels.*.name, 'rfc')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      repository-projects: write
      contents: read
    steps:
      - name: Add to Project
        uses: actions/add-to-project@v0.5.0
        with:
          project-url: https://github.com/orgs/TU_ORG/projects/1
          github-token: ${{ secrets.GITHUB_TOKEN }}
