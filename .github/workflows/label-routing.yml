name: Label RFC
on:
  issues:
    types: [opened, edited]
jobs:
  label:
    if: contains(github.event.issue.labels.*.name, 'rfc')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Add labels (example)
        uses: actions-ecosystem/action-add-labels@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          labels: |
            change-request
            rfc
