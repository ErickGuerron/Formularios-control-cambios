name: Project Field Change Listener
on:
  project_card:
    types: [moved, created, edited]
permissions:
  contents: read
  issues: write
  repository-projects: write
jobs:
  handle_status_ccc_change:
    runs-on: ubuntu-latest
    steps:
      - name: Handle Status_CCC Change
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECTS_PAT }}
          script: |
            const payload = context.payload;
            const norm = (s) => (s ?? '').toString().normalize('NFD').replace(/\p{Diacritic}/gu,'').trim().toLowerCase();
            
            // 1. Verificar si el cambio es relevante
            const isColumnChange = payload.project_card.column_id;
            const isFieldChange = payload.project_card.note;
            
            if (!isColumnChange && !isFieldChange) {
              console.log('No relevant changes detected. Skipping.');
              return;
            }
            
            // 2. Obtener información del item
            const issueNodeId = payload.project_card.content_id;
            const issueInfo = await github.graphql(
              `query($nodeId: ID!){
                node(id: $nodeId) {
                  ... on Issue {
                    id
                    number
                    repository {
                      name
                      owner { login }
                    }
                    labels(first: 20) {
                      nodes { name }
                    }
                  }
                }
              }`, { nodeId: issueNodeId }
            );
            
            const issue = issueInfo.node;
            if (!issue) {
              console.log('Could not retrieve issue info from node ID.');
              return;
            }
            
            const repo = issue.repository.name;
            const owner = issue.repository.owner.login;
            const issue_number = issue.number;
            
            // 3. Obtener columnas del proyecto
            const columns = await github.graphql(
              `query($projectId:ID!){
                node(id:$projectId) {
                  ... on Project {
                    columns(first:100) {
                      nodes {
                        id
                        name
                      }
                    }
                  }
                }
              }`, { projectId: payload.project.number }
            );
            
            // 4. Procesar cambios de columna
            if (isColumnChange) {
              const currentColumn = columns.node.columns.nodes.find(col => col.id === payload.project_card.column_id);
              const previousColumn = columns.node.columns.nodes.find(col => col.id === payload.project_card.previous_column_id);
              
              if (currentColumn && previousColumn) {
                console.log(`Item moved from column "${previousColumn.name}" to "${currentColumn.name}"`);
                
                // Verificar si el movimiento es relevante para Status_CCC
                if (norm(currentColumn.name) === norm('Status_CCC')) {
                  await handleStatusCCCChange(issue, currentColumn, owner, repo, issue_number);
                }
              }
            }
            
            // 5. Procesar cambios de campo
            if (isFieldChange) {
              const isStatusCCC = norm(payload.project_card.note) === norm('Status_CCC');
              if (isStatusCCC) {
                await handleStatusCCCChange(issue, null, owner, repo, issue_number);
              }
            }
            
            async function handleStatusCCCChange(issue, column, owner, repo, issue_number) {
              const requiredFields = ['Impact', 'Implementation Plan', 'RollBack Planning', 'Test Planning', 'Approvers', 'Start date', 'Target date'];
              const missing = [];
              
              // Verificar campos requeridos
              for (const field of requiredFields) {
                if (!getFieldValue(field)) {
                  missing.push(field);
                }
              }
              
              if (missing.length) {
                // CAMPOS FALTANTES: Revertir y comentar
                console.log('Missing fields. Reverting to Inbox.');
                await moveToColumn('Inbox');
                const list = missing.map(m => `- [ ] ${m}`).join('\n');
                await github.rest.issues.createComment({
                  owner, repo, issue_number,
                  body: `### Datos adicionales requeridos\nSe movió a **Status_CCC**, pero faltan los siguientes campos en el Proyecto:\n\n${list}\n\nSe revirtió **Status_CCC → Inbox**. Por favor, completa los campos faltantes en la vista del proyecto e intenta moverla a "Status_CCC" nuevamente.`
                });
              } else {
                // CAMPOS COMPLETOS: Asignar etiqueta 'approved'
                console.log('All fields present. Adding "approved" label.');
                await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['approved'] });
                try { await github.rest.issues.removeLabel({ owner, repo, issue_number, name: 'denied' }) } catch(e){}
              }
            }
            
            function getFieldValue(fieldName) {
              // Implementar lógica para obtener el valor del campo
              // Esta función debe adaptarse según cómo tengas organizados tus campos
              return true; // Placeholder
            }
            
            async function moveToColumn(columnName) {
              const targetColumn = columns.node.columns.nodes.find(col => norm(col.name) === norm(columnName));
              if (!targetColumn) return;
              
              await github.graphql(
                `mutation($projectId:ID!, $cardId:ID!, $columnId:ID!){
                  updateProjectCard(input:{ 
                    projectNumber: $projectId,
                    cardId: $cardId,
                    columnId: $columnId
                  }){ clientMutationId }
                }`, { 
                  projectId: payload.project.number,
                  cardId: payload.project_card.id,
                  columnId: targetColumn.id 
                }
              );
            }